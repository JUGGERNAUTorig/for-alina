<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<meta name="theme-color" content="#000008">
<title>Это всё для тебя 💛</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000008;
    font-family: 'Georgia', 'Times New Roman', serif;
    color: #f4e4bc;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }
  canvas {
    display: block;
    position: fixed;
    inset: 0;
    width: 100% !important;
    height: 100% !important;
  }

  .intro {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 30px 24px;
    background: radial-gradient(ellipse at center, #0a0620 0%, #000008 70%);
    text-align: center;
    transition: opacity 1.5s ease;
  }
  .intro.hide {
    opacity: 0;
    pointer-events: none;
  }
  .intro-ornament {
    font-size: 14px;
    color: #d4af37;
    letter-spacing: 12px;
    margin-bottom: 22px;
    opacity: 0.7;
  }
  .intro-h1 {
    font-size: 28px;
    font-weight: normal;
    letter-spacing: 2px;
    line-height: 1.4;
    margin-bottom: 16px;
    color: #f4e4bc;
    text-shadow: 0 0 30px rgba(212, 175, 55, 0.6);
    max-width: 520px;
  }
  .intro-h1 b {
    color: #ffd97d;
    font-weight: bold;
    text-shadow: 0 0 30px rgba(255, 217, 125, 0.9);
  }
  .intro-sub {
    font-size: 15px;
    font-style: italic;
    color: rgba(244, 228, 188, 0.65);
    line-height: 1.7;
    margin-bottom: 40px;
    max-width: 460px;
    letter-spacing: 0.5px;
  }
  .intro-hint {
    font-size: 12px;
    color: rgba(244, 228, 188, 0.4);
    letter-spacing: 1.5px;
    margin-top: 24px;
    font-style: italic;
    max-width: 400px;
    line-height: 1.7;
  }
  .intro-btn {
    padding: 18px 52px;
    border: 2px solid #d4af37;
    border-radius: 16px;
    background: linear-gradient(135deg, rgba(212, 175, 55, 0.28), rgba(212, 175, 55, 0.08));
    color: #ffd97d;
    font-family: 'Georgia', serif;
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 5px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.35s ease;
    box-shadow: 0 0 35px rgba(212, 175, 55, 0.35);
    position: relative;
    overflow: hidden;
    animation: btnPulse 2.5s ease-in-out infinite;
  }
  .intro-btn::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 217, 125, 0.5), transparent);
    animation: shine 3s infinite;
  }
  @keyframes shine {
    0% { left: -100%; }
    50% { left: 100%; }
    100% { left: 100%; }
  }
  @keyframes btnPulse {
    0%, 100% { box-shadow: 0 0 35px rgba(212, 175, 55, 0.35); }
    50%      { box-shadow: 0 0 70px rgba(212, 175, 55, 0.8); }
  }
  .intro-btn:hover {
    background: linear-gradient(135deg, rgba(212, 175, 55, 0.5), rgba(212, 175, 55, 0.18));
    transform: translateY(-3px) scale(1.04);
    color: #fff;
  }
  .intro-btn:active { transform: scale(0.97); }

  .hint {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 50;
    padding: 10px 22px;
    background: rgba(0, 0, 0, 0.55);
    border: 1px solid rgba(212, 175, 55, 0.3);
    border-radius: 20px;
    color: rgba(244, 228, 188, 0.75);
    font-size: 12px;
    letter-spacing: 1.5px;
    font-style: italic;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1s ease;
  }
  .hint.show { opacity: 1; animation: hintFade 8s ease forwards; }
  @keyframes hintFade {
    0% { opacity: 0; }
    10% { opacity: 1; }
    85% { opacity: 1; }
    100% { opacity: 0; }
  }

  .fireworks-btn {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(30px);
    z-index: 60;
    padding: 15px 38px;
    border: 2px solid #ff8ec4;
    border-radius: 14px;
    background: linear-gradient(135deg, rgba(255, 105, 180, 0.32), rgba(255, 105, 180, 0.1));
    color: #ffd6ea;
    font-family: 'Georgia', serif;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.35s ease;
    box-shadow: 0 0 30px rgba(255, 105, 180, 0.45);
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
    animation: btnPulsePink 2.5s ease-in-out infinite;
  }
  .fireworks-btn.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
    pointer-events: auto;
    transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.2, 1.4, 0.4, 1), background 0.35s ease, box-shadow 0.35s ease;
  }
  .fireworks-btn::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 217, 228, 0.55), transparent);
    animation: shine 3s infinite;
  }
  @keyframes btnPulsePink {
    0%, 100% { box-shadow: 0 0 30px rgba(255, 105, 180, 0.45); }
    50%      { box-shadow: 0 0 60px rgba(255, 105, 180, 0.9); }
  }
  .fireworks-btn:hover:not(:disabled) {
    background: linear-gradient(135deg, rgba(255, 105, 180, 0.55), rgba(255, 105, 180, 0.2));
    transform: translateX(-50%) translateY(-3px) scale(1.04);
    color: #fff;
  }
  .fireworks-btn:active:not(:disabled) { transform: translateX(-50%) scale(0.97); }
  .fireworks-btn:disabled {
    opacity: 0.6;
    cursor: default;
    animation: none;
  }

  .loading-text {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(244, 228, 188, 0.6);
    font-size: 14px;
    letter-spacing: 2px;
    z-index: 90;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  .loading-text.show { opacity: 1; }

  @media (max-width: 480px) {
    .intro-h1 { font-size: 22px; }
    .intro-sub { font-size: 13.5px; margin-bottom: 32px; }
    .intro-btn { font-size: 14px; padding: 15px 40px; letter-spacing: 4px; }
    .fireworks-btn { font-size: 12.5px; padding: 13px 28px; letter-spacing: 2px; bottom: 72px; }
    .hint { font-size: 11px; padding: 8px 16px; bottom: 24px; }
  }
</style>
</head>
<body>

<div class="intro" id="intro">
  <div class="intro-ornament">✦ ✦ ✦</div>
  <h1 class="intro-h1">А теперь — <b>посмотри на небо</b></h1>
  <p class="intro-sub">
    Повернись вокруг и найди моё послание.<br>
    Оно написано звёздами — специально для тебя.
  </p>
  <button class="intro-btn" id="startBtn">Открыть небо</button>
  <div class="intro-hint">
    📱 На телефоне — поворачивайся вокруг<br>
    💻 На компьютере — веди мышкой<br>
    👆 Если не работает — просто сдвинь пальцем
  </div>
</div>

<div class="loading-text" id="loadingText">Зажигаем звёзды...</div>

<button class="fireworks-btn" id="fireworksBtn">🎆 Запустить салют</button>

<div class="hint" id="hint">🌌 Поворачивайся, читай по кругу</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function() {
  'use strict';

  /* ============================================================
     ⚙️ НАСТРОЙКА
     ============================================================ */
  const SKY_TEXT =
    "Это всё для тебя, моя любимая · я очень долго это делал · " +
    "и сделал только потому, что очень сильно тебя люблю · " +
    "моя родная · моя единственная · моя навсегда";

  const FIREWORK_TEXT = "Я тебя очень сильно люблю";

  const TEXT_HEIGHT = 240;
  const MAX_TEXTURE_WIDTH = 8000;

  // ⏱ Частота
  const AUTO_FIREWORK_INTERVAL = 900;    // салюты каждые 0.9 сек
  const AUTO_TEXT_INTERVAL     = 1300;   // тексты каждые 1.3 сек

  // 🎯 Насколько широко разбрасывать объекты перед камерой (в градусах)
  // Текст появляется в узком конусе, чтобы быть прямо перед глазами
  const TEXT_CONE_H = 45;   // ±45° по горизонтали
  const TEXT_CONE_V = 28;   // ±28° по вертикали

  // Салюты — чуть шире, но тоже в основном впереди
  const FIREWORK_CONE_H = 75;
  const FIREWORK_CONE_V = 45;

  const FIREWORK_COLORS = [
    0xffd97d, 0xffb6c1, 0xffffff, 0xc8a2ff, 0xa8e6ff, 0xff9ec4
  ];
  const PARTICLES_PER_BURST = 80;
  const DIST_MIN = 650;
  const DIST_MAX = 900;
  /* ============================================================ */

  const introEl = document.getElementById('intro');
  const startBtn = document.getElementById('startBtn');
  const fireworksBtn = document.getElementById('fireworksBtn');
  const hintEl = document.getElementById('hint');
  const loadingText = document.getElementById('loadingText');

  let scene, camera, renderer, skyGroup;
  let targetRotationX = 0;
  let targetRotationY = 0;
  let currentRotationX = 0;
  let currentRotationY = 0;

  let useDeviceOrientation = false;
  let hasOrientation = false;
  let dragging = false;
  let dragStartX = 0, dragStartY = 0;
  let dragStartRotX = 0, dragStartRotY = 0;
  let starsMaterial = null;

  let fireworksEnabled = false;
  let autoFireworkTimer = null;
  let autoTextTimer = null;

  let fireworkList = [];
  let textList = [];

  /* ---------- СГЛАЖИВАНИЕ ДАТЧИКОВ ---------- */
  let totalAlpha = 0;
  let lastRawAlpha = null;
  let calibratedBeta = null;
  let smoothBetaOffset = 0;

  function initThree() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000008);

    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 5000);
    camera.position.set(0, 0, 0);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    skyGroup = new THREE.Group();
    skyGroup.rotation.order = 'YXZ';
    scene.add(skyGroup);

    createStars();
    createBigStars();
    createNebula();
    createTextCylinder();

    animate();

    window.addEventListener('resize', onResize);
    window.addEventListener('mousemove', onMouseMove);
    window.addEventListener('touchstart', onTouchStart, { passive: true });
    window.addEventListener('touchmove', onTouchMove, { passive: true });
    window.addEventListener('touchend', onTouchEnd);
    document.addEventListener('click', onCanvasClick);

    setTimeout(() => hintEl.classList.add('show'), 500);
  }

  function createStars() {
    const count = 2500;
    const geo = new THREE.BufferGeometry();
    const positions = new Float32Array(count * 3);
    const colors = new Float32Array(count * 3);
    const sizes = new Float32Array(count);

    for (let i = 0; i < count; i++) {
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      const r = 900 + Math.random() * 600;

      positions[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
      positions[i * 3 + 1] = r * Math.cos(phi);
      positions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);

      const roll = Math.random();
      let cr, cg, cb;
      if (roll < 0.55) { cr = 1; cg = 1; cb = 1; }
      else if (roll < 0.75) { cr = 1; cg = 0.9; cb = 0.6; }
      else if (roll < 0.9) { cr = 0.85; cg = 0.9; cb = 1; }
      else { cr = 1; cg = 0.85; cb = 0.9; }

      colors[i * 3]     = cr;
      colors[i * 3 + 1] = cg;
      colors[i * 3 + 2] = cb;
      sizes[i] = 1.5 + Math.random() * 3.5;
    }

    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

    starsMaterial = new THREE.ShaderMaterial({
      uniforms: { uTime: { value: 0 } },
      vertexShader: [
        'attribute float size;',
        'attribute vec3 color;',
        'varying vec3 vColor;',
        'varying float vTwinkle;',
        'uniform float uTime;',
        'void main() {',
        '  vColor = color;',
        '  vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);',
        '  gl_PointSize = size * (350.0 / -mvPosition.z);',
        '  gl_Position = projectionMatrix * mvPosition;',
        '  float seed = position.x * 0.01 + position.y * 0.02 + position.z * 0.03;',
        '  vTwinkle = 0.65 + 0.35 * sin(uTime * 2.0 + seed * 6.28);',
        '}'
      ].join('\n'),
      fragmentShader: [
        'varying vec3 vColor;',
        'varying float vTwinkle;',
        'void main() {',
        '  vec2 c = gl_PointCoord - 0.5;',
        '  float d = length(c);',
        '  if (d > 0.5) discard;',
        '  float alpha = smoothstep(0.5, 0.0, d);',
        '  alpha = pow(alpha, 1.8);',
        '  gl_FragColor = vec4(vColor, alpha * vTwinkle);',
        '}'
      ].join('\n'),
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });

    skyGroup.add(new THREE.Points(geo, starsMaterial));
  }

  function createBigStars() {
    const count = 45;
    const geo = new THREE.BufferGeometry();
    const positions = new Float32Array(count * 3);

    for (let i = 0; i < count; i++) {
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      const r = 700 + Math.random() * 500;
      positions[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
      positions[i * 3 + 1] = r * Math.cos(phi);
      positions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
    }
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    const mat = new THREE.PointsMaterial({
      color: 0xffd97d,
      size: 14,
      transparent: true,
      opacity: 0.9,
      sizeAttenuation: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      map: createGlowTexture()
    });

    skyGroup.add(new THREE.Points(geo, mat));
  }

  function createGlowTexture() {
    const c = document.createElement('canvas');
    c.width = 128;
    c.height = 128;
    const ctx = c.getContext('2d');
    const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
    grad.addColorStop(0, 'rgba(255, 245, 210, 1)');
    grad.addColorStop(0.25, 'rgba(255, 217, 125, 0.7)');
    grad.addColorStop(0.6, 'rgba(255, 217, 125, 0.15)');
    grad.addColorStop(1, 'rgba(255, 217, 125, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 128, 128);
    return new THREE.CanvasTexture(c);
  }

  function createNebula() {
    const c = document.createElement('canvas');
    c.width = 512;
    c.height = 512;
    const ctx = c.getContext('2d');
    const grad = ctx.createRadialGradient(256, 256, 0, 256, 256, 256);
    grad.addColorStop(0, 'rgba(90, 45, 130, 0.4)');
    grad.addColorStop(0.4, 'rgba(50, 25, 90, 0.18)');
    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 512, 512);

    const tex = new THREE.CanvasTexture(c);

    for (let i = 0; i < 4; i++) {
      const spriteMat = new THREE.SpriteMaterial({
        map: tex,
        transparent: true,
        opacity: 0.65,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const sprite = new THREE.Sprite(spriteMat);
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      const r = 1500;
      sprite.position.set(
        r * Math.sin(phi) * Math.cos(theta),
        r * Math.cos(phi) * 0.5,
        r * Math.sin(phi) * Math.sin(theta)
      );
      sprite.scale.set(1400, 1400, 1);
      skyGroup.add(sprite);
    }
  }

  function createTextCylinder() {
    const measureCanvas = document.createElement('canvas');
    const mctx = measureCanvas.getContext('2d');

    let fontSize = 140;
    let textWidth = 0;
    const sidePadding = 200;

    while (true) {
      mctx.font = 'bold ' + fontSize + 'px Georgia, "Times New Roman", serif';
      textWidth = mctx.measureText(SKY_TEXT).width;
      if (textWidth + sidePadding * 2 <= MAX_TEXTURE_WIDTH || fontSize <= 40) break;
      fontSize -= 4;
    }

    const canvasWidth = Math.min(MAX_TEXTURE_WIDTH, Math.ceil(textWidth + sidePadding * 2));
    const canvasHeight = Math.round(fontSize * 3);

    const canvas = document.createElement('canvas');
    canvas.width = canvasWidth;
    canvas.height = canvasHeight;
    const ctx = canvas.getContext('2d');

    ctx.clearRect(0, 0, canvasWidth, canvasHeight);
    ctx.font = 'bold ' + fontSize + 'px Georgia, "Times New Roman", serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const cx = canvasWidth / 2;
    const cy = canvasHeight / 2;

    ctx.fillStyle = '#ffe9b5';
    ctx.shadowColor = '#ffd97d';
    ctx.shadowBlur = 80;
    ctx.fillText(SKY_TEXT, cx, cy);

    ctx.shadowBlur = 30;
    ctx.fillText(SKY_TEXT, cx, cy);

    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff8e0';
    ctx.fillText(SKY_TEXT, cx, cy);

    ctx.shadowBlur = 12;
    ctx.shadowColor = '#fff3c8';
    ctx.fillText(SKY_TEXT, cx, cy);

    const tex = new THREE.CanvasTexture(canvas);
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    tex.wrapS = THREE.ClampToEdgeWrapping;
    tex.wrapT = THREE.ClampToEdgeWrapping;

    const radius = (TEXT_HEIGHT * canvasWidth) / (2 * Math.PI * canvasHeight);
    const geometry = new THREE.CylinderGeometry(radius, radius, TEXT_HEIGHT, 128, 1, true);

    const uvAttr = geometry.attributes.uv;
    for (let i = 0; i < uvAttr.count; i++) {
      uvAttr.setX(i, 1 - uvAttr.getX(i));
    }
    uvAttr.needsUpdate = true;

    const material = new THREE.MeshBasicMaterial({
      map: tex,
      transparent: true,
      opacity: 1,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      depthTest: false,
      side: THREE.BackSide
    });

    const cylinder = new THREE.Mesh(geometry, material);
    cylinder.renderOrder = 999;
    skyGroup.add(cylinder);
  }

  /* ============================================================
     🎯 НАПРАВЛЕНИЕ ВЗГЛЯДА В ЛОКАЛЬНЫХ КООРДИНАТАХ skyGroup
     ============================================================ */
  function getForwardDirectionLocal() {
    // Мировое направление "куда смотрит камера" — это (0, 0, -1)
    // Переводим его в локальные координаты skyGroup (обратные повороты)
    const euler = new THREE.Euler(-currentRotationX, -currentRotationY, 0, 'YXZ');
    return new THREE.Vector3(0, 0, -1).applyEuler(euler).normalize();
  }

  // Возвращает точку в конусе перед взглядом (в локальных координатах skyGroup)
  function getPointInCone(angleH, angleV, distMin, distMax) {
    const forward = getForwardDirectionLocal();

    // Строим ортонормированный базис вокруг forward
    const zAxis = forward.clone();
    let xAxis = new THREE.Vector3(0, 1, 0).cross(zAxis);
    if (xAxis.lengthSq() < 0.001) xAxis.set(1, 0, 0);
    xAxis.normalize();
    const yAxis = zAxis.clone().cross(xAxis).normalize();

    const randH = THREE.MathUtils.degToRad((Math.random() - 0.5) * 2 * angleH);
    const randV = THREE.MathUtils.degToRad((Math.random() - 0.5) * 2 * angleV);

    // Смещаем forward на tangents
    const dir = zAxis.clone()
      .add(xAxis.clone().multiplyScalar(Math.tan(randH)))
      .add(yAxis.clone().multiplyScalar(Math.tan(randV)))
      .normalize();

    const dist = distMin + Math.random() * (distMax - distMin);
    return dir.multiplyScalar(dist);
  }

  /* ============================================================
     САЛЮТ
     ============================================================ */
  function spawnFirework(centerPos) {
    if (!skyGroup) return;

    let bx, by, bz;
    if (centerPos) {
      bx = centerPos.x; by = centerPos.y; bz = centerPos.z;
    } else {
      const pos = getPointInCone(FIREWORK_CONE_H, FIREWORK_CONE_V, DIST_MIN, DIST_MAX);
      bx = pos.x; by = pos.y; bz = pos.z;
    }

    const color = FIREWORK_COLORS[Math.floor(Math.random() * FIREWORK_COLORS.length)];
    const color2 = FIREWORK_COLORS[Math.floor(Math.random() * FIREWORK_COLORS.length)];

    const count = PARTICLES_PER_BURST;
    const positions = new Float32Array(count * 3);
    const colors = new Float32Array(count * 3);
    const velocities = new Float32Array(count * 3);
    const sizes = new Float32Array(count);

    const c1 = new THREE.Color(color);
    const c2 = new THREE.Color(color2);

    for (let i = 0; i < count; i++) {
      positions[i*3] = bx;
      positions[i*3+1] = by;
      positions[i*3+2] = bz;

      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      const speed = 4 + Math.random() * 8;

      velocities[i*3]   = Math.sin(phi) * Math.cos(theta) * speed;
      velocities[i*3+1] = Math.cos(phi) * speed;
      velocities[i*3+2] = Math.sin(phi) * Math.sin(theta) * speed;

      const mix = Math.random();
      const cc = c1.clone().lerp(c2, mix);
      colors[i*3] = cc.r;
      colors[i*3+1] = cc.g;
      colors[i*3+2] = cc.b;

      sizes[i] = 2 + Math.random() * 4;
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

    const mat = new THREE.ShaderMaterial({
      uniforms: { uOpacity: { value: 1.0 } },
      vertexShader: [
        'attribute float size;',
        'attribute vec3 color;',
        'varying vec3 vColor;',
        'void main() {',
        '  vColor = color;',
        '  vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);',
        '  gl_PointSize = size * (450.0 / -mvPosition.z);',
        '  gl_Position = projectionMatrix * mvPosition;',
        '}'
      ].join('\n'),
      fragmentShader: [
        'varying vec3 vColor;',
        'uniform float uOpacity;',
        'void main() {',
        '  vec2 c = gl_PointCoord - 0.5;',
        '  float d = length(c);',
        '  if (d > 0.5) discard;',
        '  float alpha = smoothstep(0.5, 0.0, d);',
        '  alpha = pow(alpha, 1.8);',
        '  gl_FragColor = vec4(vColor, alpha * uOpacity);',
        '}'
      ].join('\n'),
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });

    const points = new THREE.Points(geo, mat);
    skyGroup.add(points);

    fireworkList.push({
      points, geo, mat, velocities, sizes,
      life: 0,
      maxLife: 3.6
    });
  }

  /* ============================================================
     ТЕКСТ (в узком конусе прямо перед глазами)
     ============================================================ */
  function spawnFloatingText() {
    if (!skyGroup) return;

    // Узкий конус — текст появляется в основном прямо перед глазами
    const pos = getPointInCone(TEXT_CONE_H, TEXT_CONE_V, DIST_MIN * 0.9, DIST_MAX * 0.9);

    const sprite = createTextSprite(FIREWORK_TEXT);
    sprite.position.copy(pos);
    sprite.material.opacity = 0;
    skyGroup.add(sprite);

    textList.push({
      sprite,
      life: 0,
      maxLife: 3.2
    });
  }

  function createTextSprite(text) {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');

    const fontSize = 90;
    ctx.font = 'bold ' + fontSize + 'px Georgia, "Times New Roman", serif';
    const metrics = ctx.measureText(text);

    canvas.width = Math.ceil(metrics.width + 200);
    canvas.height = fontSize * 2.4;

    const ctx2 = canvas.getContext('2d');
    ctx2.clearRect(0, 0, canvas.width, canvas.height);
    ctx2.font = 'bold ' + fontSize + 'px Georgia, "Times New Roman", serif';
    ctx2.textAlign = 'center';
    ctx2.textBaseline = 'middle';

    const cx = canvas.width / 2;
    const cy = canvas.height / 2;

    ctx2.fillStyle = '#fff2c8';
    ctx2.shadowColor = '#ffd97d';
    ctx2.shadowBlur = 60;
    ctx2.fillText(text, cx, cy);

    ctx2.shadowBlur = 25;
    ctx2.fillText(text, cx, cy);

    ctx2.shadowBlur = 0;
    ctx2.fillStyle = '#fff8e0';
    ctx2.fillText(text, cx, cy);

    const tex = new THREE.CanvasTexture(canvas);
    tex.minFilter = THREE.LinearFilter;

    const mat = new THREE.SpriteMaterial({
      map: tex,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      depthTest: false
    });

    const sprite = new THREE.Sprite(mat);
    sprite.scale.set(canvas.width * 0.5, canvas.height * 0.5, 1);
    return sprite;
  }

  /* ============================================================
     ОБНОВЛЕНИЕ
     ============================================================ */
  function updateFireworks(dt) {
    for (let i = fireworkList.length - 1; i >= 0; i--) {
      const fw = fireworkList[i];
      fw.life += dt;

      const posArr = fw.geo.attributes.position.array;
      const count = posArr.length / 3;

      for (let j = 0; j < count; j++) {
        const vx = fw.velocities[j*3];
        const vy = fw.velocities[j*3+1];
        const vz = fw.velocities[j*3+2];

        posArr[j*3]   += vx;
        posArr[j*3+1] += vy;
        posArr[j*3+2] += vz;

        fw.velocities[j*3]   *= 0.965;
        fw.velocities[j*3+1] *= 0.965;
        fw.velocities[j*3+2] *= 0.965;
        fw.velocities[j*3+1] -= 0.05;
      }
      fw.geo.attributes.position.needsUpdate = true;

      const opacity = Math.max(0, 1 - fw.life / fw.maxLife);
      fw.mat.uniforms.uOpacity.value = opacity;

      if (fw.life >= fw.maxLife) {
        skyGroup.remove(fw.points);
        fw.geo.dispose();
        fw.mat.dispose();
        fireworkList.splice(i, 1);
      }
    }
  }

  function updateTexts(dt) {
    for (let i = textList.length - 1; i >= 0; i--) {
      const tItem = textList[i];
      tItem.life += dt;
      const p = tItem.sprite.material;

      if (tItem.life < 0.6) {
        p.opacity = tItem.life / 0.6;
      } else if (tItem.life < tItem.maxLife - 0.9) {
        p.opacity = 1;
      } else if (tItem.life < tItem.maxLife) {
        p.opacity = 1 - (tItem.life - (tItem.maxLife - 0.9)) / 0.9;
      } else {
        p.opacity = 0;
      }

      tItem.sprite.position.y += dt * 8;

      if (tItem.life >= tItem.maxLife) {
        skyGroup.remove(tItem.sprite);
        if (tItem.sprite.material.map) tItem.sprite.material.map.dispose();
        tItem.sprite.material.dispose();
        textList.splice(i, 1);
      }
    }
  }

  /* ---------- АНИМАЦИЯ ---------- */
  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);

    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.getElapsedTime();
    if (starsMaterial) starsMaterial.uniforms.uTime.value = t;

    if (useDeviceOrientation && hasOrientation) {
      targetRotationY = THREE.MathUtils.degToRad(-totalAlpha);
      targetRotationX = THREE.MathUtils.degToRad(smoothBetaOffset);
    }

    const lerpFactor = 0.06;
    currentRotationY += (targetRotationY - currentRotationY) * lerpFactor;
    currentRotationX += (targetRotationX - currentRotationX) * lerpFactor;

    skyGroup.rotation.y = currentRotationY;
    skyGroup.rotation.x = currentRotationX;

    if (fireworksEnabled) {
      updateFireworks(dt);
      updateTexts(dt);
    }

    renderer.render(scene, camera);
  }

  /* ---------- ДАТЧИКИ ---------- */
  function onDeviceOrientation(event) {
    if (event.alpha === null || event.alpha === undefined) return;
    const rawAlpha = event.alpha;
    const rawBeta = event.beta !== null ? event.beta : 90;

    if (lastRawAlpha === null) {
      lastRawAlpha = rawAlpha;
      calibratedBeta = rawBeta;
      totalAlpha = 0;
      smoothBetaOffset = 0;
      hasOrientation = true;
      return;
    }

    let deltaAlpha = rawAlpha - lastRawAlpha;
    while (deltaAlpha > 180) deltaAlpha -= 360;
    while (deltaAlpha < -180) deltaAlpha += 360;
    if (Math.abs(deltaAlpha) > 0.15) {
      totalAlpha += deltaAlpha;
      lastRawAlpha = rawAlpha;
    }

    const betaOffset = rawBeta - calibratedBeta;
    smoothBetaOffset = smoothBetaOffset * 0.85 + betaOffset * 0.15;
    smoothBetaOffset = Math.max(-60, Math.min(60, smoothBetaOffset));

    hasOrientation = true;
  }

  function onMouseMove(e) {
    if (useDeviceOrientation && hasOrientation) return;
    const x = (e.clientX / window.innerWidth) * 2 - 1;
    const y = (e.clientY / window.innerHeight) * 2 - 1;
    targetRotationY = -x * Math.PI * 1.2;
    targetRotationX = -y * Math.PI * 0.5;
  }

  function onTouchStart(e) {
    if (useDeviceOrientation && hasOrientation) return;
    const t = e.touches[0];
    dragging = true;
    dragStartX = t.clientX;
    dragStartY = t.clientY;
    dragStartRotX = targetRotationX;
    dragStartRotY = targetRotationY;
  }

  function onTouchMove(e) {
    if (!dragging) return;
    if (useDeviceOrientation && hasOrientation) return;
    const t = e.touches[0];
    const dx = t.clientX - dragStartX;
    const dy = t.clientY - dragStartY;
    targetRotationY = dragStartRotY + dx * 0.006;
    targetRotationX = dragStartRotX + dy * 0.006;
    targetRotationX = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, targetRotationX));
  }

  function onTouchEnd() {
    dragging = false;
  }

  function onCanvasClick(e) {
    if (!renderer || !fireworksEnabled) return;
    if (introEl && introEl.style.display !== 'none') return;
    if (e.target && e.target.tagName === 'BUTTON') return;

    const nx = (e.clientX / window.innerWidth) * 2 - 1;
    const ny = -((e.clientY / window.innerHeight) * 2 - 1);

    // Направление тапа в локальных координатах skyGroup
    const euler = new THREE.Euler(-currentRotationX, -currentRotationY, 0, 'YXZ');
    const dirLocal = new THREE.Vector3(nx, ny, -1).normalize().applyEuler(euler);

    const dist = 700 + Math.random() * 200;
    const target = dirLocal.multiplyScalar(dist);

    spawnFirework(target);
    setTimeout(spawnFloatingText, 150);
  }

  async function requestOrientation() {
    if (typeof DeviceOrientationEvent === 'undefined') return false;
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      try {
        const state = await DeviceOrientationEvent.requestPermission();
        return state === 'granted';
      } catch (err) {
        return false;
      }
    }
    return true;
  }

  function onResize() {
    if (!camera || !renderer) return;
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  /* ---------- СТАРТ ---------- */
  startBtn.addEventListener('click', async () => {
    loadingText.classList.add('show');

    const granted = await requestOrientation();
    if (granted) {
      window.addEventListener('deviceorientation', onDeviceOrientation, true);
      useDeviceOrientation = true;
    }

    introEl.classList.add('hide');

    setTimeout(() => {
      introEl.style.display = 'none';
      loadingText.classList.remove('show');
      initThree();

      setTimeout(() => {
        fireworksBtn.classList.add('show');
      }, 800);

      setTimeout(() => {
        if (useDeviceOrientation && !hasOrientation) {
          useDeviceOrientation = false;
          hintEl.textContent = '👆 Проведи пальцем, чтобы осмотреться';
          hintEl.classList.remove('show');
          void hintEl.offsetWidth;
          hintEl.classList.add('show');
        }
      }, 2000);
    }, 700);
  });

  fireworksBtn.addEventListener('click', () => {
    if (fireworksEnabled) return;
    fireworksEnabled = true;

    fireworksBtn.textContent = '🎆 Салют запущен';
    fireworksBtn.disabled = true;

    hintEl.textContent = '🎆 Тапни по небу — запусти свой салют';
    hintEl.classList.remove('show');
    void hintEl.offsetWidth;
    hintEl.classList.add('show');

    // Первые залпы
    spawnFirework();
    setTimeout(spawnFloatingText, 200);
    setTimeout(spawnFirework, 400);
    setTimeout(spawnFloatingText, 700);

    // Салюты
    autoFireworkTimer = setInterval(() => {
      spawnFirework();
      if (Math.random() < 0.4) {
        setTimeout(() => spawnFirework(), 200);
      }
    }, AUTO_FIREWORK_INTERVAL);

    // Тексты
    autoTextTimer = setInterval(() => {
      spawnFloatingText();
    }, AUTO_TEXT_INTERVAL);
  });

})();
</script>
</body>
</html>
