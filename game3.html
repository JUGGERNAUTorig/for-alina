<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<meta name="theme-color" content="#000008">
<title>Это всё для тебя 💛</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000008;
    font-family: 'Georgia', 'Times New Roman', serif;
    color: #f4e4bc;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }
  canvas {
    display: block;
    position: fixed;
    inset: 0;
    width: 100% !important;
    height: 100% !important;
  }

  .intro {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 30px 24px;
    background: radial-gradient(ellipse at center, #0a0620 0%, #000008 70%);
    text-align: center;
    transition: opacity 1.5s ease;
  }
  .intro.hide {
    opacity: 0;
    pointer-events: none;
  }
  .intro-ornament {
    font-size: 14px;
    color: #d4af37;
    letter-spacing: 12px;
    margin-bottom: 22px;
    opacity: 0.7;
  }
  .intro-h1 {
    font-size: 28px;
    font-weight: normal;
    letter-spacing: 2px;
    line-height: 1.4;
    margin-bottom: 16px;
    color: #f4e4bc;
    text-shadow: 0 0 30px rgba(212, 175, 55, 0.6);
    max-width: 520px;
  }
  .intro-h1 b {
    color: #ffd97d;
    font-weight: bold;
    text-shadow: 0 0 30px rgba(255, 217, 125, 0.9);
  }
  .intro-sub {
    font-size: 15px;
    font-style: italic;
    color: rgba(244, 228, 188, 0.65);
    line-height: 1.7;
    margin-bottom: 40px;
    max-width: 460px;
    letter-spacing: 0.5px;
  }
  .intro-hint {
    font-size: 12px;
    color: rgba(244, 228, 188, 0.4);
    letter-spacing: 1.5px;
    margin-top: 24px;
    font-style: italic;
    max-width: 400px;
    line-height: 1.7;
  }
  .intro-btn {
    padding: 18px 52px;
    border: 2px solid #d4af37;
    border-radius: 16px;
    background: linear-gradient(135deg, rgba(212, 175, 55, 0.28), rgba(212, 175, 55, 0.08));
    color: #ffd97d;
    font-family: 'Georgia', serif;
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 5px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.35s ease;
    box-shadow: 0 0 35px rgba(212, 175, 55, 0.35);
    position: relative;
    overflow: hidden;
    animation: btnPulse 2.5s ease-in-out infinite;
  }
  .intro-btn::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 217, 125, 0.5), transparent);
    animation: shine 3s infinite;
  }
  @keyframes shine {
    0% { left: -100%; }
    50% { left: 100%; }
    100% { left: 100%; }
  }
  @keyframes btnPulse {
    0%, 100% { box-shadow: 0 0 35px rgba(212, 175, 55, 0.35); }
    50%      { box-shadow: 0 0 70px rgba(212, 175, 55, 0.8); }
  }
  .intro-btn:hover {
    background: linear-gradient(135deg, rgba(212, 175, 55, 0.5), rgba(212, 175, 55, 0.18));
    transform: translateY(-3px) scale(1.04);
    color: #fff;
  }
  .intro-btn:active { transform: scale(0.97); }

  .hint {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 50;
    padding: 10px 22px;
    background: rgba(0, 0, 0, 0.55);
    border: 1px solid rgba(212, 175, 55, 0.3);
    border-radius: 20px;
    color: rgba(244, 228, 188, 0.75);
    font-size: 12px;
    letter-spacing: 1.5px;
    font-style: italic;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1s ease;
  }
  .hint.show { opacity: 1; animation: hintFade 7s ease forwards; }
  @keyframes hintFade {
    0% { opacity: 0; }
    10% { opacity: 1; }
    80% { opacity: 1; }
    100% { opacity: 0; }
  }

  .loading-text {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(244, 228, 188, 0.6);
    font-size: 14px;
    letter-spacing: 2px;
    z-index: 90;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  .loading-text.show { opacity: 1; }
</style>
</head>
<body>

<div class="intro" id="intro">
  <div class="intro-ornament">✦ ✦ ✦</div>
  <h1 class="intro-h1">А теперь — <b>посмотри на небо</b></h1>
  <p class="intro-sub">
    Повернись вокруг и найди моё послание.<br>
    Оно написано звёздами — специально для тебя.
  </p>
  <button class="intro-btn" id="startBtn">Открыть небо</button>
  <div class="intro-hint">
    📱 На телефоне — поворачивайся вокруг<br>
    💻 На компьютере — веди мышкой<br>
    👆 Если не работает — просто сдвинь пальцем
  </div>
</div>

<div class="loading-text" id="loadingText">Зажигаем звёзды...</div>

<div class="hint" id="hint">🌌 Поворачивайся, чтобы осмотреться</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function() {
  'use strict';

  /* ============================================================
     ⚙️ НАСТРОЙКА — можешь менять текст здесь
     \n = перенос строки
     ============================================================ */
  const SKY_TEXT =
    "Это всё для тебя, моя любимая.\n" +
    "Я очень долго это делал\n" +
    "и сделал только потому,\n" +
    "что очень сильно тебя люблю,\n" +
    "моя родная.";
  /* ============================================================ */

  const introEl = document.getElementById('intro');
  const startBtn = document.getElementById('startBtn');
  const hintEl = document.getElementById('hint');
  const loadingText = document.getElementById('loadingText');

  let scene, camera, renderer, skyGroup;
  let targetRotationX = 0;
  let targetRotationY = 0;
  let currentRotationX = 0;
  let currentRotationY = 0;

  let useDeviceOrientation = false;
  let hasOrientation = false;
  let initialAlpha = null;
  let deviceAlpha = 0;
  let deviceBeta = 90;

  let dragging = false;
  let dragStartX = 0, dragStartY = 0;
  let dragStartRotX = 0, dragStartRotY = 0;

  let starsMaterial = null;

  // ---------- INIT ----------
  function initThree() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000008);

    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 5000);
    camera.position.set(0, 0, 0);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    skyGroup = new THREE.Group();
    skyGroup.rotation.order = 'YXZ';
    scene.add(skyGroup);

    createStars();
    createBigStars();
    createText();
    createNebula();

    animate();

    window.addEventListener('resize', onResize);
    window.addEventListener('mousemove', onMouseMove);
    window.addEventListener('touchstart', onTouchStart, { passive: true });
    window.addEventListener('touchmove', onTouchMove, { passive: true });
    window.addEventListener('touchend', onTouchEnd);

    // Show hint
    setTimeout(() => hintEl.classList.add('show'), 500);
  }

  // ---------- SMALL STARS ----------
  function createStars() {
    const count = 2500;
    const geo = new THREE.BufferGeometry();
    const positions = new Float32Array(count * 3);
    const colors = new Float32Array(count * 3);
    const sizes = new Float32Array(count);

    for (let i = 0; i < count; i++) {
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      const r = 800 + Math.random() * 400;

      positions[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
      positions[i * 3 + 1] = r * Math.cos(phi);
      positions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);

      const roll = Math.random();
      let cr, cg, cb;
      if (roll < 0.55) { cr = 1; cg = 1; cb = 1; }
      else if (roll < 0.75) { cr = 1; cg = 0.9; cb = 0.6; }
      else if (roll < 0.9) { cr = 0.85; cg = 0.9; cb = 1; }
      else { cr = 1; cg = 0.85; cb = 0.9; }

      colors[i * 3]     = cr;
      colors[i * 3 + 1] = cg;
      colors[i * 3 + 2] = cb;

      sizes[i] = 1.5 + Math.random() * 3.5;
    }

    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

    starsMaterial = new THREE.ShaderMaterial({
      uniforms: { uTime: { value: 0 } },
      vertexShader: [
        'attribute float size;',
        'attribute vec3 color;',
        'varying vec3 vColor;',
        'varying float vTwinkle;',
        'uniform float uTime;',
        'void main() {',
        '  vColor = color;',
        '  vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);',
        '  gl_PointSize = size * (350.0 / -mvPosition.z);',
        '  gl_Position = projectionMatrix * mvPosition;',
        '  float seed = position.x * 0.01 + position.y * 0.02 + position.z * 0.03;',
        '  vTwinkle = 0.65 + 0.35 * sin(uTime * 2.0 + seed * 6.28);',
        '}'
      ].join('\n'),
      fragmentShader: [
        'varying vec3 vColor;',
        'varying float vTwinkle;',
        'void main() {',
        '  vec2 c = gl_PointCoord - 0.5;',
        '  float d = length(c);',
        '  if (d > 0.5) discard;',
        '  float alpha = smoothstep(0.5, 0.0, d);',
        '  alpha = pow(alpha, 1.8);',
        '  gl_FragColor = vec4(vColor, alpha * vTwinkle);',
        '}'
      ].join('\n'),
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });

    const stars = new THREE.Points(geo, starsMaterial);
    skyGroup.add(stars);
  }

  // ---------- BIG GLOWING STARS ----------
  function createBigStars() {
    const count = 45;
    const geo = new THREE.BufferGeometry();
    const positions = new Float32Array(count * 3);

    for (let i = 0; i < count; i++) {
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      const r = 700 + Math.random() * 400;
      positions[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
      positions[i * 3 + 1] = r * Math.cos(phi);
      positions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
    }
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    const mat = new THREE.PointsMaterial({
      color: 0xffd97d,
      size: 14,
      transparent: true,
      opacity: 0.9,
      sizeAttenuation: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      map: createGlowTexture()
    });

    const bigStars = new THREE.Points(geo, mat);
    skyGroup.add(bigStars);
  }

  function createGlowTexture() {
    const c = document.createElement('canvas');
    c.width = 128;
    c.height = 128;
    const ctx = c.getContext('2d');
    const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
    grad.addColorStop(0, 'rgba(255, 245, 210, 1)');
    grad.addColorStop(0.25, 'rgba(255, 217, 125, 0.7)');
    grad.addColorStop(0.6, 'rgba(255, 217, 125, 0.15)');
    grad.addColorStop(1, 'rgba(255, 217, 125, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 128, 128);
    return new THREE.CanvasTexture(c);
  }

  // ---------- NEBULA ----------
  function createNebula() {
    const c = document.createElement('canvas');
    c.width = 512;
    c.height = 512;
    const ctx = c.getContext('2d');
    const grad = ctx.createRadialGradient(256, 256, 0, 256, 256, 256);
    grad.addColorStop(0, 'rgba(90, 45, 130, 0.4)');
    grad.addColorStop(0.4, 'rgba(50, 25, 90, 0.18)');
    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 512, 512);

    const tex = new THREE.CanvasTexture(c);

    for (let i = 0; i < 4; i++) {
      const spriteMat = new THREE.SpriteMaterial({
        map: tex,
        transparent: true,
        opacity: 0.65,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const sprite = new THREE.Sprite(spriteMat);
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      const r = 1500;
      sprite.position.set(
        r * Math.sin(phi) * Math.cos(theta),
        r * Math.cos(phi) * 0.5,
        r * Math.sin(phi) * Math.sin(theta)
      );
      sprite.scale.set(1400, 1400, 1);
      skyGroup.add(sprite);
    }
  }

  // ---------- TEXT AS STARS ----------
  function createText() {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 2048;
    canvas.height = 1024;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const lines = SKY_TEXT.split('\n');
    const fontSize = 88;
    const lineHeight = fontSize * 1.5;

    ctx.font = 'bold ' + fontSize + 'px Georgia, "Times New Roman", serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffe9b5';

    const totalH = (lines.length - 1) * lineHeight;
    const startY = (canvas.height - totalH) / 2;

    // Outer glow
    ctx.shadowColor = '#ffd97d';
    ctx.shadowBlur = 60;
    lines.forEach((line, i) => {
      ctx.fillText(line, canvas.width / 2, startY + i * lineHeight);
    });

    // Inner glow
    ctx.shadowBlur = 25;
    lines.forEach((line, i) => {
      ctx.fillText(line, canvas.width / 2, startY + i * lineHeight);
    });

    // Sharp pass
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff8e0';
    lines.forEach((line, i) => {
      ctx.fillText(line, canvas.width / 2, startY + i * lineHeight);
    });

    const tex = new THREE.CanvasTexture(canvas);
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    tex.minFilter = THREE.LinearFilter;

    const mat = new THREE.MeshBasicMaterial({
      map: tex,
      transparent: true,
      opacity: 0.98,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      depthTest: false,
      side: THREE.DoubleSide
    });

    const width = 1100;
    const height = width * (canvas.height / canvas.width);
    const geo = new THREE.PlaneGeometry(width, height);
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(0, 0, -800);
    mesh.rotation.y = Math.PI;

    skyGroup.add(mesh);
  }

  // ---------- ANIMATE ----------
  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);

    const t = clock.getElapsedTime();
    if (starsMaterial) starsMaterial.uniforms.uTime.value = t;

    // Determine target based on input
    if (useDeviceOrientation && hasOrientation) {
      // alpha delta from initial position
      let alphaDelta = deviceAlpha - initialAlpha;
      // Normalize to -180..180
      while (alphaDelta > 180) alphaDelta -= 360;
      while (alphaDelta < -180) alphaDelta += 360;

      targetRotationY = THREE.MathUtils.degToRad(alphaDelta);
      targetRotationX = THREE.MathUtils.degToRad(90 - deviceBeta);
    }

    // Smooth lerp
    currentRotationY += (targetRotationY - currentRotationY) * 0.09;
    currentRotationX += (targetRotationX - currentRotationX) * 0.09;

    skyGroup.rotation.y = currentRotationY;
    skyGroup.rotation.x = currentRotationX;

    renderer.render(scene, camera);
  }

  // ---------- DEVICE ORIENTATION ----------
  function onDeviceOrientation(event) {
    if (event.alpha === null || event.alpha === undefined) return;
    if (initialAlpha === null) initialAlpha = event.alpha;
    hasOrientation = true;
    deviceAlpha = event.alpha;
    deviceBeta = event.beta !== null ? event.beta : 90;
  }

  // ---------- MOUSE (desktop) ----------
  function onMouseMove(e) {
    if (useDeviceOrientation && hasOrientation) return;
    const x = (e.clientX / window.innerWidth) * 2 - 1;
    const y = (e.clientY / window.innerHeight) * 2 - 1;
    targetRotationY = -x * Math.PI * 1.2;
    targetRotationX = -y * Math.PI * 0.5;
  }

  // ---------- TOUCH DRAG (mobile fallback) ----------
  function onTouchStart(e) {
    if (useDeviceOrientation && hasOrientation) return;
    const t = e.touches[0];
    dragging = true;
    dragStartX = t.clientX;
    dragStartY = t.clientY;
    dragStartRotX = targetRotationX;
    dragStartRotY = targetRotationY;
  }

  function onTouchMove(e) {
    if (!dragging) return;
    if (useDeviceOrientation && hasOrientation) return;
    const t = e.touches[0];
    const dx = t.clientX - dragStartX;
    const dy = t.clientY - dragStartY;
    targetRotationY = dragStartRotY + dx * 0.006;
    targetRotationX = dragStartRotX + dy * 0.006;
    targetRotationX = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, targetRotationX));
  }

  function onTouchEnd() {
    dragging = false;
  }

  // ---------- PERMISSION (iOS) ----------
  async function requestOrientation() {
    if (typeof DeviceOrientationEvent === 'undefined') return false;
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      try {
        const state = await DeviceOrientationEvent.requestPermission();
        return state === 'granted';
      } catch (err) {
        return false;
      }
    }
    return true;
  }

  // ---------- RESIZE ----------
  function onResize() {
    if (!camera || !renderer) return;
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  // ---------- START ----------
  startBtn.addEventListener('click', async () => {
    // Show loading
    loadingText.classList.add('show');

    // Request permission
    const granted = await requestOrientation();

    if (granted) {
      window.addEventListener('deviceorientation', onDeviceOrientation, true);
      useDeviceOrientation = true;
    }

    // Fade out intro
    introEl.classList.add('hide');

    setTimeout(() => {
      introEl.style.display = 'none';
      loadingText.classList.remove('show');
      initThree();

      // If after 2 seconds we didn't receive orientation data — fallback
      setTimeout(() => {
        if (useDeviceOrientation && !hasOrientation) {
          useDeviceOrientation = false;
          hintEl.textContent = '👆 Проведите пальцем, чтобы осмотреться';
          hintEl.classList.remove('show');
          void hintEl.offsetWidth;
          hintEl.classList.add('show');
        }
      }, 2000);
    }, 700);
  });

})();
</script>
</body>
</html>
